services:
  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: safepass1
      POSTGRES_DB: r3vidsf
#    ports:
#      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/@database:5432/r3vidsf"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  r3vids-api:
    build:
      context: ./
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - ./data:/app/data
#    command: flask run
    depends_on:
      database:
        condition: service_healthy
  r3vue:
    build:
      context: ./r3vue
    ports:
      - '5173:5173'
    volumes:
      - ./r3vue:/app
      - /app/node_modules
    command: npm run dev
volumes:
  pgdata:
